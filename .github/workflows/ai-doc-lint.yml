name: ai-doc-lint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-doc-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main
        run: git fetch --force origin +refs/heads/main:refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run ai-doc-lint unit tests
        run: node --test .github/scripts/ai-doc-lint.test.mjs

      - name: Run local ai-doc lint gate
        run: scripts/ai-doc-lint-gate.sh --base origin/main
